# The connector dials OUT to Twingate's relay. No port forward, no exposed
# WireGuard endpoint, nothing inbound on the router at all. Combined with
# DNS-01 certs this gives a fully remote-accessible cluster behind a closed
# inbound firewall - see docs/decisions.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twingate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://twingate.github.io/helm-charts
    chart: connector
    targetRevision: 0.1.29   # VERIFY - see docs/versions.md
    helm:
      values: |
        connector:
          network: __TWINGATE_NETWORK__
        existingSecret: twingate-connector-keys   # sealed; see SEALING.md
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits:   {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: twingate
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
