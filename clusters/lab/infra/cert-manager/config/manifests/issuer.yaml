# DNS-01, not HTTP-01. DNS-01 proves domain ownership by writing a TXT record,
# so real Let's Encrypt certs are issued for internal-only names with ZERO
# inbound ports open on the router. This is the whole trick.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones: ["__DOMAIN__"]
---
# Staging issuer. Let's Encrypt production has a hard rate limit of 5 duplicate
# certs per week - burn through it debugging and you are locked out for days.
# Always get a green issuance on staging first, then flip the Gateway over.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones: ["__DOMAIN__"]
