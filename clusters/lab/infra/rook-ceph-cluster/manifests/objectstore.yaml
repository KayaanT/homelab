# The S3 endpoint. This is what makes Ceph load-bearing rather than decorative:
# MLflow artifacts and Velero backups both land here (see workloads/mlflow).
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: s3
  namespace: rook-ceph
spec:
  metadataPool:
    failureDomain: osd
    replicated: {size: 2, requireSafeReplicaSize: false}
  dataPool:
    failureDomain: osd
    replicated: {size: 2, requireSafeReplicaSize: false}
  preservePoolsOnDelete: true
  gateway:
    port: 80
    instances: 1
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits:   {memory: 512Mi}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-bucket
provisioner: rook-ceph.ceph.rook.io/bucket
reclaimPolicy: Retain
parameters:
  objectStoreName: s3
  objectStoreNamespace: rook-ceph
