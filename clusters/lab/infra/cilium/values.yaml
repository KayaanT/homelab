# Cilium is doing four jobs here, which is why Calico was dropped:
#   1. CNI datapath (eBPF)
#   2. kube-proxy replacement  -> no iptables service chains
#   3. LoadBalancer + L2 announcements -> replaces MetalLB
#   4. Gateway API implementation -> replaces ingress-nginx
# One component instead of four matters a lot at 16GB.

kubeProxyReplacement: true

# REQUIRED when kube-proxy is absent. Without these the agent cannot reach the
# API server to bootstrap, and it presents as a hanging CNI with no clear error.
k8sServiceHost: "k8s.__DOMAIN__"
k8sServicePort: 6443

ipam:
  mode: kubernetes

bpf:
  masquerade: true

l2announcements:
  enabled: true
externalIPs:
  enabled: true

gatewayAPI:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

# l2announcements leases are chatty against the API server; the defaults are
# too low and cause client-side throttling warnings.
k8sClientRateLimit:
  qps: 20
  burst: 100

operator:
  # Single node - one operator replica, not the default two (which never
  # schedules and sits Pending forever).
  replicas: 1

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits:   {memory: 512Mi}
