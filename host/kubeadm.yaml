# Phase 1b - cluster init config.
# Applied with:  sudo kubeadm init --config host/kubeadm.yaml --skip-phases=addon/kube-proxy
#
# The --skip-phases flag is NOT expressible here; it must be passed on the CLI.
# Cilium replaces kube-proxy with its eBPF datapath, so kube-proxy must never
# be installed. This decision is made once, at init, and is painful to reverse.
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: stable
# A DNS name (not a bare IP) puts the right SAN in the apiserver cert, so the
# cluster stays reachable through Twingate later without regenerating certs.
controlPlaneEndpoint: "k8s.__DOMAIN__:6443"
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
apiServer:
  certSANs:
    - "k8s.__DOMAIN__"
    - "__NODE_IP__"
    - "127.0.0.1"
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
# Keep a floor of memory for the OS so an OOM storm can't take the node down.
systemReserved:
  memory: "512Mi"
evictionHard:
  memory.available: "300Mi"
