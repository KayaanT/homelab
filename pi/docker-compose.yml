# Out-of-band services on the Pi. Deliberately NOT Kubernetes: the point of
# these is that they keep working when the cluster does not.
services:

  coredns:
    image: quay.io/oriedge/k8s_gateway:latest   # CoreDNS + the k8s_gateway plugin
    container_name: coredns
    restart: unless-stopped
    network_mode: host          # needs :53 on the LAN address
    volumes:
      - ./coredns/Corefile:/Corefile:ro
      - ./coredns/kubeconfig:/kubeconfig:ro    # read-only SA token, see below
    command: ["-conf", "/Corefile"]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports: ["3001:3001"]
    volumes:
      - ./data/uptime-kuma:/app/data

